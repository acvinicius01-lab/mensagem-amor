<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mensagem de amor</title>
    <style>
      :root {
        --pink-1: #fff1f7;
        --pink-2: #ffd9ee;
        --pink-3: #ff6fa9;
        --pink-4: #d6296d;
        --text: #4d1d33;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--pink-1), var(--pink-2));
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
      }

      .container {
        text-align: center;
        padding: 40px 20px;
      }

      .heart {
        width: 160px;
        height: 160px;
        position: relative;
        transform: rotate(-45deg);
        margin: 0 auto 32px;
        background: linear-gradient(135deg, var(--pink-3), var(--pink-4));
        animation: pulse 1.2s infinite ease-in-out;
        box-shadow: 0 18px 30px rgba(214, 41, 109, 0.25);
      }

      .heart::before,
      .heart::after {
        content: "";
        position: absolute;
        width: 160px;
        height: 160px;
        background: inherit;
        border-radius: 50%;
      }

      .heart::before {
        top: -80px;
        left: 0;
      }

      .heart::after {
        left: 80px;
        top: 0;
      }

      @keyframes pulse {
        0%, 100% {
          transform: rotate(-45deg) scale(1);
        }
        50% {
          transform: rotate(-45deg) scale(1.08);
        }
      }

      .message {
        max-width: 700px;
        margin: 0 auto;
        font-size: clamp(1.4rem, 2.5vw, 2.5rem);
        line-height: 1.4;
        font-weight: 700;
        text-shadow: 0 2px 8px rgba(255, 255, 255, 0.5);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="heart" aria-label="coração"></div>
      <p class="message">Por favor, Mievillyn.. Não desiste da gente, eu te amo muito!</p>
    </div>
  </body>
</html>
