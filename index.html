<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mensagem para você</title>
    <style>
      :root {
        --bg1: #fff4f8;
        --bg2: #ffd9e8;
        --accent: #ff4d8d;
        --accent-dark: #d6296d;
        --text: #5d2c4d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--bg1), var(--bg2));
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
      }

      .card {
        background: rgba(255, 255, 255, 0.7);
        border: 2px solid rgba(255, 77, 141, 0.25);
        border-radius: 22px;
        padding: 36px 28px;
        box-shadow: 0 20px 40px rgba(214, 41, 109, 0.12);
        text-align: center;
        max-width: 460px;
        width: 90%;
      }

      h1 {
        margin: 0 0 20px;
        font-size: clamp(1.8rem, 2vw, 2.5rem);
      }

      .button {
        display: inline-block;
        background: linear-gradient(135deg, var(--accent), var(--accent-dark));
        color: #fff;
        text-decoration: none;
        font-weight: 700;
        padding: 16px 28px;
        border-radius: 999px;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
        box-shadow: 0 12px 22px rgba(214, 41, 109, 0.28);
      }

      .button:hover {
        transform: translateY(-2px) scale(1.01);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Você é muito especial para mim 💖</h1>
      <a class="button" href="mensagem.html" target="_blank" rel="noopener noreferrer">
        Abrir mensagem
      </a>
    </div>
  </body>
</html>
